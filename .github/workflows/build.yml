name: Build WristReader APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile and sign WristReader APK
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          AJAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | sort -V | tail -n 1)
          mkdir -p build/classes build/dex build/gen
          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/unsigned.apk --manifest AndroidManifest.xml -I "$AJAR" --java build/gen build/res.zip
          javac --release 11 -cp "$AJAR" -d build/classes $(find build/gen -name "*.java") src/com/akemi/wristreader/*.java
          "$BT/d8" --min-api 26 --output build/dex $(find build/classes -name "*.class")
          (cd build/dex && zip -q -u ../unsigned.apk classes*.dex)
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US"
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --out WristReader.apk build/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WristReader-APK
          path: WristReader.apk
